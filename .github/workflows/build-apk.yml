name: Build Flutter APK and IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # --- ANDROID DERLEME İŞİ ---
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prevent recursion
        if: ${{ github.actor == 'github-actions[bot]' }}
        run: exit 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.6'
          channel: stable

      - name: Cache Flutter packages and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
            android/.gradle
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}-${{ hashFiles('**/android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Read version from pubspec.yaml
        id: vars
        shell: bash
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml || true)
          VERSION=$(echo "$VERSION_LINE" | sed -E "s/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/" || true)
          BUILD=$(echo "$VERSION_LINE" | sed -E "s/.*\+([0-9]+).*/\1/" || true)
          DATE=$(date +'%Y%m%d')
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          if [ -z "$BUILD" ]; then BUILD="${GITHUB_RUN_NUMBER}"; fi
          APK_NAME="archis-academy-${VERSION}+${BUILD}-${DATE}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${BUILD}" >> "$GITHUB_ENV"

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/${APK_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: artifacts/*.apk
          retention-days: 7

  # --- IOS DERLEME İŞİ ---
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prevent recursion
        if: ${{ github.actor == 'github-actions[bot]' }}
        run: exit 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.6'
          channel: stable

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Read version for iOS
        id: ios_vars
        shell: bash
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml || true)
          VERSION=$(echo "$VERSION_LINE" | sed -E "s/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/" || true)
          BUILD=$(echo "$VERSION_LINE" | sed -E "s/.*\+([0-9]+).*/\1/" || true)
          DATE=$(date +'%Y%m%d')
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          if [ -z "$BUILD" ]; then BUILD="${GITHUB_RUN_NUMBER}"; fi
          IPA_NAME="archis-academy-${VERSION}+${BUILD}-${DATE}"
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"

      - name: Build IPA (Unsigned)
        run: flutter build ipa --release --no-codesign

      - name: Prepare IPA artifact
        shell: bash
        run: |
          mkdir -p ios_artifacts
          # Flutter imzasız derlemede ürünü payload klasörüne koyar, onu zipleyip .ipa yapıyoruz
          cd build/ios/archive/Runner.xcarchive/Products/Applications
          mkdir Payload
          mv Runner.app Payload/
          zip -r "../../../../../../ios_artifacts/${{ env.IPA_NAME }}.ipa" Payload
          ls -la "../../../../../../ios_artifacts"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ios_artifacts/*.ipa
          retention-days: 7
